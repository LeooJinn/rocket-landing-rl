[project]
name = "rocket-landing"
version = "0.1.0"
description = "2D rocket-landing environment and reinforcement-learning experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocket_landing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
